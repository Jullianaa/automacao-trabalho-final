name: Pipeline de Testes Automatizados
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cypress-run: macos-latest
    runs-on: 

    steps:
      - name: Checkout do Repositorio
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar Dependencias do Projeto
        run: npm ci

      - name: Executar Testes Cypress Headless
        uses: cypress-io/github-action@v6
        with:
          record: false
          browser: chrome
      - name: Upload do Relatorio HTML Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-html
          path: cypress/reports/html/
          retention-days: 30